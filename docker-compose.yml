services:
  postgres:
    image: postgres:16-alpine
    container_name: pos-pci-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos
      POSTGRES_DB: pos_pci
    ports:
      - "5432:5432"
    volumes:
      - pos_pci_postgres_data:/var/lib/postgresql/data

volumes:
  pos_pci_postgres_data:
